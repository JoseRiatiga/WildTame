# All of the plugin's text: menu titles, item names/lore and chat messages.
# Translate or change whatever you want and use /wildtame admin reload to apply it without
# restarting the server. Colors use & (e.g. &a = green) and placeholders go between
# %percent-signs% — don't remove the ones that appear in the original text, they're real
# data (pet name, level, time, etc.) the plugin fills in.
#
# This is the English language file (lang/en.yml). lang/es.yml (Spanish) also exists. Which
# one is used is picked with "language: en" (or "es") in config.yml. You can make your own
# language by copying this file to lang/<code>.yml and pointing "language" at that code.

nameplate:
  # The floating nametag that appears above the pet's head.
  evolved-prefix: "★ "
  format: "%evolved%&8[&aLv. %level%&8] &f%name% %health-icon% %hunger-icon%"
  health-icon-high: "&a♥ %percent%%"
  health-icon-mid: "&e♥ %percent%%"
  health-icon-low: "&c♥ %percent%%"
  hunger-icon-high: "&a■ %percent%%"
  hunger-icon-mid: "&e■ %percent%%"
  hunger-icon-low: "&c■ %percent%%"
  # Name shown in menus (inventory item), no color of its own — the menu adds its own
  # color in front of it.
  display-name-format: "%evolved%%name% [Lv. %level%]"

