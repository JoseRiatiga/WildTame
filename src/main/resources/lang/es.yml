# Todos los textos del plugin: títulos de menú, nombres/lore de ítems y mensajes de chat.
# Traduce o cambia lo que quieras y usa /wildtame admin reload para aplicarlo sin reiniciar el
# servidor. Los colores se escriben con & (ej. &a = verde) y los placeholders van entre
# %porcentajes% — no borres los que aparezcan en el texto original, son datos reales
# (nombre de la mascota, nivel, tiempo, etc.) que el plugin rellena.
#
# Este es el idioma español (lang/es.yml). También existe lang/en.yml (inglés). Cuál se usa
# se elige con "language: es" (o "en") en config.yml. Puedes crear tu propio idioma copiando
# este archivo a lang/<codigo>.yml y apuntando "language" a ese código.

nameplate:
  # El letrero flotante que aparece sobre la cabeza de la mascota.
  evolved-prefix: "★ "
  format: "%evolved%&8[&aNv. %level%&8] &f%name% %health-icon% %hunger-icon%"
  health-icon-high: "&a♥ %percent%%"
  health-icon-mid: "&e♥ %percent%%"
  health-icon-low: "&c♥ %percent%%"
  hunger-icon-high: "&a■ %percent%%"
  hunger-icon-mid: "&e■ %percent%%"
  hunger-icon-low: "&c■ %percent%%"
  # Nombre que se ve en los menús (item del inventario), sin colores propios — el menú le
  # pone su propio color por delante.
  display-name-format: "%evolved%%name% [Nv. %level%]"

